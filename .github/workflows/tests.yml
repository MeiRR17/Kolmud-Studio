name: Workflow and CLI tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install workflow test dependencies
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          # pip constraints reject extras (e.g. uvicorn[standard]). Keep one
          # canonical version list but remove extras from the constraint copy.
          text = Path("requirements.txt").read_text()
          Path(os.environ["RUNNER_TEMP"], "kolmud-constraints.txt").write_text(re.sub(r"\[[^\]\n]+\]", "", text))
          PY
          python -m pip install -r requirements-test.txt -c "$RUNNER_TEMP/kolmud-constraints.txt"
      - name: Expose packaged test ffmpeg
        run: |
          mkdir -p "$RUNNER_TEMP/kolmud-tools"
          ln -s "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/kolmud-tools/ffmpeg"
          echo "$RUNNER_TEMP/kolmud-tools" >> "$GITHUB_PATH"
      - name: Install terminal entry point
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Tests (simulated model engines)
        run: python -m pytest -q
      - name: Terminal version and patch format
        run: |
          kolmud --version
          git diff --check
