name: Workflow and CLI tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Audio tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30
            sudo apt-get install -y ffmpeg libsndfile1
          fi
          ffmpeg -version
      - name: Install workflow test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install terminal entry point
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Tests (simulated model engines)
        run: python -m pytest -q
      - name: Terminal version and patch format
        run: |
          kolmud --version
          git diff --check
