name: Workflow and CLI tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - name: Install workflow test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install terminal entry point
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Tests (simulated model engines)
        run: python -m pytest -q
      - name: Terminal version and patch format
        run: |
          kolmud --version
          git diff --check
